name: Source tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path backend/Cargo.toml --all -- --check
      - run: cargo test --manifest-path backend/Cargo.toml --locked
      - run: cargo clippy --manifest-path backend/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo run --manifest-path backend/Cargo.toml --locked -p nitrosense-tools -- checklist --check
      - run: node --test frontend/host/*.test.cjs tests/*.test.cjs
      # Core utilities use built-in modules. No Electron or Acer assets in CI.
      - run: node --test legacy/tests/*.test.cjs legacy/runtime/*.test.cjs
      - name: Require reverse engineering evidence for implementation changes
        if: github.event_name == 'pull_request'
        env:
          RE_AUDIT_BASE: ${{ github.event.pull_request.base.sha }}
        run: npm run audit:changes
